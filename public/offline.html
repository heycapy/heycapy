<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>offline - heycapy</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fdf6e3;
        --fg: #3b3b3b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #1d2021;
          --fg: #ebdbb2;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 1rem;
        background: var(--bg);
        color: var(--fg);
        font-family: ui-monospace, monospace;
        text-align: center;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 1px solid currentColor;
        padding: 0.4rem 0.9rem;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <p>you're offline, and this device hasn't opened heycapy yet.</p>
    <p>connect once and it will open here without a connection next time.</p>
    <button type="button" onclick="location.reload()">try again</button>
  </body>
</html>
