services:
  heycapy:
    build: .
    restart: unless-stopped
    env_file: .env
    # everything else comes from .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/data/heycapy.db
    volumes:
      - heycapy_data:/data
    expose:
      - "3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  heycapy_data:
  caddy_data:
  caddy_config:
